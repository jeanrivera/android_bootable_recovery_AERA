name: Build AERA UI Module

on:
  push:
    branches: [ "aera-16.0", "16.0", "main" ]
  pull_request:
    branches: [ "aera-16.0", "16.0", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential g++ cmake ninja-build

      - name: Verify WebScene Syntax
        run: |
          echo "Verifying web_scene.cpp syntax..."
          g++ -fsyntax-only -std=c++20 \
            -I. -Iaeraui \
            aeraui/features/browser/web_scene.cpp || true